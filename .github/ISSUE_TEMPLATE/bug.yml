name: Bug report
description: Report reproducible module behavior on a supported Zalo build.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please remove personal information from screenshots and logs.
  - type: input
    id: module_version
    attributes:
      label: Zalo Patch version
      placeholder: versionCode and versionName
    validations:
      required: true
  - type: input
    id: zalo_version
    attributes:
      label: Zalo version code
      placeholder: Exact numeric versionCode
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Device, Android version, LSPosed version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, what was expected, and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Self-check state or minimal redacted logs. Remove all private content.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I removed personal information from the report.
          required: true
